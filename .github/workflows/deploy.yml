name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler v4 要求 Node >= 22，用 20 会直接报错退出
          node-version: '22'

      # 必须装依赖：wrangler-action 默认用 npx 找 wrangler，
      # 不装的话它会自行安装并可能落到 v3 —— 而 v3 读不到
      # wrangler.toml 的 pages_build_output_dir，会直接部署失败。
      - name: Install dependencies
        run: npm ci

      - name: Verify wrangler version
        run: npx wrangler --version

      - name: Build static site
        run: node scripts/build.mjs

      # 跑测试：head 结构化数据 + 登录核心逻辑 + 登录 SQL 集成 + markdown 渲染器
      # 这些测试全是纯逻辑 / 内存库，不需要网络和凭据，CI 里跑得飞快
      - name: Run tests
        run: |
          node scripts/test-head.mjs
          node scripts/test-auth.mjs
          node --no-warnings scripts/test-auth-db.mjs
          node --no-warnings scripts/test-md.mjs
          # 每日文章机器人的离线自测（不联网、不需要任何凭据）
          node scripts/test-bot.mjs

      # ★ 幂等建表：schema.sql 里全是 CREATE TABLE IF NOT EXISTS，
      #   反复执行安全。放在部署前，避免「代码上线了但库里没表 → 接口 500」。
      #   历史上踩过这个坑（新增 login_codes 等表时线上接口全 500）。
      - name: Apply D1 schema (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: d1 execute diaoche-db --file=./schema.sql --remote

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy dist --project-name=diaoche-cn

      # ★ 部署后体检：确认关键环境变量在「运行中的部署」里真的生效。
      #   为什么必须有这一步：本项目用 wrangler 直传部署（Direct Upload），
      #   而 Direct Upload **不携带项目级环境变量** —— 变量只能在控制台配、
      #   且必须重新部署才生效。历史上踩过坑：DC_ADMIN_KEY 变空导致整个后台
      #   401，但 CI 全绿、没人发现，是老孟自己发现后台进不去才暴露的。
      #   给 CDN 一点时间让新部署生效。
      - name: Wait for deployment to propagate
        run: sleep 20

      - name: Post-deploy health check
        run: node scripts/check-env.mjs
