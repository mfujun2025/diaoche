# Cloudflare Pages 项目配置
# 注意：D1 之后通过控制台创建，用 `wrangler d1 create diaoche-db` 拿到 database_id 再填回来
name = "diaoche-cn"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "diaoche-db"
database_id = "a7eb7c3b-d557-4da8-8d8e-982a874ae3f5"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "diaoche-images"

[vars]
ENV = "production"
SITE_NAME = "吊车.cn"
# 后台访问令牌：登录 /admin/ 时输入。
#
# ⚠️ 这里留空是刻意的 —— 本项目是公开仓库，令牌写进 wrangler.toml 等于公开。
#    请改用加密 Secret 配置（优先级高于此处，同名会覆盖）：
#
#      控制台：Workers & Pages → diaoche-cn → Settings → Variables and Secrets
#              → + Add → 类型选 Secret → Name: ADMIN_TOKEN → Value: <你的令牌> → Save
#              → 然后重新部署一次（Deployments → Retry deployment）
#
#      命令行：npx wrangler pages secret put ADMIN_TOKEN --project-name diaoche-cn
#
# 生成令牌：node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
#
# ⚠️ 未配置时，所有 /api/admin/* 接口一律返回 401（fail closed），后台进不去。
ADMIN_TOKEN = ""
