# Cloudflare Pages 项目配置
# 注意：D1 之后通过控制台创建，用 `wrangler d1 create diaoche-db` 拿到 database_id 再填回来
name = "diaoche-cn"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "diaoche-db"
database_id = "a7eb7c3b-d557-4da8-8d8e-982a874ae3f5"

# R2 图片存储（后置启用）
# 启用前提：Cloudflare API Token 需含 Account / Workers R2 Storage / Edit 权限，
# 且在 CF 控制台 R2 → Create bucket 建好 diaoche-images 桶。
# 建好后取消下面注释并重新部署即可。
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "diaoche-images"

[vars]
ENV = "production"
SITE_NAME = "吊车.cn"
# 后台审核白名单（逗号分隔）。留空则任何通过 Cloudflare Access 的账号都能审核。
# 强烈建议填上你自己的邮箱，做双重保险。
ADMIN_EMAILS = ""
