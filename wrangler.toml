# Cloudflare Pages 项目配置
# 注意：D1 之后通过控制台创建，用 `wrangler d1 create diaoche-db` 拿到 database_id 再填回来
name = "diaoche-cn"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "diaoche-db"
database_id = "a7eb7c3b-d557-4da8-8d8e-982a874ae3f5"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "diaoche-images"

[vars]
ENV = "production"
SITE_NAME = "吊车.cn"

# ── 后台访问密钥 DC_ADMIN_KEY ─────────────────────────────────────────
# 刻意不在这里声明！本项目是公开仓库，密钥写进 wrangler.toml 等于公开。
#
# ⚠️ 而且只要这里出现某个变量名（哪怕值是空的），CF 侧就会占住这个名字，
#    控制台就没法再加同名 Secret，会报
#    "Another variable with this name already exists in this worker."
#    （历史坑：ADMIN_TOKEN 就是这样被占住的，只能换名才解开）
#
# 正确做法 —— 只在这里以外配置，二选一：
#
#   控制台：Workers & Pages → diaoche-cn → Settings → Variables and Secrets
#           → + Add → 类型选 Secret → Name: DC_ADMIN_KEY → Value: <你的密钥> → Save
#           → 然后重新部署一次（Deployments → 最新那条 → Retry deployment）
#
#   命令行：npx wrangler pages secret put DC_ADMIN_KEY --project-name diaoche-cn
#
# 生成密钥：node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
#
# ⚠️ 未配置时所有 /api/admin/* 一律 401（fail closed），后台进不去。
