# Cloudflare Pages 项目配置
# 注意：D1 之后通过控制台创建，用 `wrangler d1 create diaoche-db` 拿到 database_id 再填回来
name = "diaoche-cn"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "diaoche-db"
database_id = "a7eb7c3b-d557-4da8-8d8e-982a874ae3f5"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "diaoche-images"

[vars]
ENV = "production"
SITE_NAME = "吊车.cn"
# 后台审核白名单（逗号分隔）。留空则任何通过 Cloudflare Access 的账号都能审核。
# 必须与 Zero Trust 应用策略里的邮箱一致，否则会出现「Access 放行但代码层拒绝」。
ADMIN_EMAILS = "548827878@qq.com"
